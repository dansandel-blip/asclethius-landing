name: Finalize Asclethius launch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'Launch Asclethius')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply production refinements
        run: python scripts/finalize_asclethius.py

      - name: Commit finalized production page
        run: |
          if git diff --quiet -- index.html; then
            echo "No production changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Finalize Asclethius production site"
          git push
