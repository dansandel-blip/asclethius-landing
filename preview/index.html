<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Asclethius — Design Preview</title>
  <style>
    html,body{margin:0;min-height:100%;background:#05060a;color:#eef2ff;font-family:system-ui,-apple-system,sans-serif}
    .loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
    .loading span{opacity:.7;font-size:14px;letter-spacing:.08em}
  </style>
</head>
<body>
  <div class="loading"><span>Loading Asclethius preview…</span></div>
  <script>
    fetch('https://raw.githubusercontent.com/dansandel-blip/asclethius-landing/asclethius-practice-design-launch/index.html?preview=' + Date.now(), {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('Preview unavailable'); return r.text(); })
      .then(function(html){
        html = html.replace('<head>', '<head><meta name="robots" content="noindex,nofollow,noarchive">');
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function(){
        document.body.innerHTML='<div class="loading"><span>Preview could not be loaded. Please refresh.</span></div>';
      });
  </script>
</body>
</html>
